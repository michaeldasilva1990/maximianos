# Maximianos - proxy reverso para o app Node (PM2) na porta 9000
#
# Destino no servidor:
#   /etc/nginx/sites-available/maximianos
# Ativar com:
#   sudo ln -s /etc/nginx/sites-available/maximianos /etc/nginx/sites-enabled/
#
# Este arquivo esta em HTTP puro de proposito. O certbot vai reescrever
# ele sozinho: adiciona o bloco 443 com SSL e o redirect do 80 pro 443.
# Nao adicione SSL na mao antes de rodar o certbot.

# Cabecalhos do upstream para o Node saber o IP e o protocolo reais
upstream maximianos_app {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    # listen [::]:80;   # descomente APENAS se o servidor tiver IPv6 (senao o nginx nao sobe)

    server_name maximianos.com.br www.maximianos.com.br;

    # Limite de upload (o site e estatico, entao pode ser baixo)
    client_max_body_size 10M;

    # Logs separados por site facilitam muito o debug depois
    access_log /var/log/nginx/maximianos.access.log;
    error_log  /var/log/nginx/maximianos.error.log;

    # Nao expoe a versao do nginx nos erros
    server_tokens off;

    location / {
        proxy_pass http://maximianos_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Mantem a conexao viva com o upstream (menos handshake, mais rapido)
        proxy_set_header Connection "";

        # Suporte a WebSocket, caso o site ganhe chat/live depois
        proxy_set_header Upgrade    $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # O video do hero tem 18 MB. Com proxy_buffering ligado o nginx
    # escreve arquivo temporario em disco a cada request; desligando,
    # o streaming passa direto e as range requests ficam bem mais leves.
    location ~* \.(mp4|webm|mov)$ {
        proxy_pass http://maximianos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Health check do app, util para monitoramento externo
    location = /health {
        proxy_pass http://maximianos_app/health;
        access_log off;
    }

    # Bloqueia arquivos sensiveis que possam acabar na pasta por engano
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
